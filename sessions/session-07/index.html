<!doctype html>

    <link rel="stylesheet" href="reset.css" />

  <body>
    <main>
      <h1>Formulario de ejemplo con tipos de input</h1>
      <p>
        Ejemplo completo para practicar radios, checkboxes, color, fecha y otros
        tipos.
      </p>

      <!-- <form action="https://httpbin.org/post" method="POST" target="_blank"> -->
      <form method="GET">
        <section class="card">
          <h2>Datos basicos</h2>
          <div class="grid">
            <div>
              <label for="nombre">Nombre</label>
              <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ash Ketchum"
                required
              />
            </div>

            <div>
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="ash@kanto.com"
                required
              />
            </div>

            <div>
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                minlength="6"
              />
            </div>

            <div>
              <label for="telefono">Telefono</label>
              <input
                type="tel"
                id="telefono"
                name="telefono"
                placeholder="600123123"
              />
            </div>

            <div>
              <label for="web">Web</label>
              <input
                type="url"
                id="web"
                name="web"
                placeholder="https://miweb.com"
              />
            </div>

            <div>
              <label for="edad">Edad</label>
              <input
                type="number"
                id="edad"
                name="edad"
                min="1"
                max="120"
                value="18"
              />
            </div>

            <div>
              <label for="search">Buscar Pokemon</label>
              <input
                type="search"
                id="search"
                name="search"
                placeholder="Pikachu"
              />
            </div>

            <div>
              <label for="avatar">Foto de perfil</label>
              <input type="file" id="avatar" name="avatar" accept="image/*" />
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Seleccion inicial y preferencias</h2>

          <fieldset>
            <legend>Pokemon inicial (radio button)</legend>
            <div class="row-inline">
              <label
                ><input
                  type="radio"
                  name="inicial"
                  value="charmander"
                  required
                />
                Charmander</label
              >
              <label
                ><input type="radio" name="inicial" value="squirtle" />
                Squirtle</label
              >
              <label
                ><input type="radio" name="inicial" value="bulbasaur" />
                Bulbasaur</label
              >
            </div>
          </fieldset>

          <div class="grid">
            <div>
              <label for="fav-color">Color favorito</label>
              <input
                type="color"
                id="fav-color"
                name="fav_color"
                value="#00aaff"
              />
            </div>

            <div>
              <label for="fecha">Fecha de inicio</label>
              <input type="date" id="fecha" name="fecha_inicio" />
            </div>

            <div>
              <label for="hora">Hora de entrenamiento</label>
              <input type="time" id="hora" name="hora_entrenamiento" />
            </div>

            <div>
              <label for="fecha-hora">Fecha y hora torneo</label>
              <input
                type="datetime-local"
                id="fecha-hora"
                name="torneo_datetime"
              />
            </div>

            <div>
              <label for="mes">Mes favorito</label>
              <input type="month" id="mes" name="mes_favorito" />
            </div>

            <div>
              <label for="semana">Semana de liga</label>
              <input type="week" id="semana" name="semana_liga" />
            </div>

            <div>
              <label for="nivel">Nivel de entrenador (range)</label>
              <input
                type="range"
                id="nivel"
                name="nivel_entrenador"
                min="1"
                max="100"
                value="35"
              />
            </div>

            <div>
              <label for="region">Region</label>
              <select id="region" name="region">
                <option value="kanto">Kanto</option>
                <option value="johto">Johto</option>
                <option value="hoenn">Hoenn</option>
                <option value="sinnoh">Sinnoh</option>
              </select>
            </div>

            <div>
              <label for="objetivo">Objetivo (datalist)</label>
              <input
                list="objetivos"
                id="objetivo"
                name="objetivo"
                placeholder="Elige o escribe"
              />
              <datalist id="objetivos">
                <option value="Completar Pokedex"></option>
                <option value="Ganar medallas"></option>
                <option value="Entrenar competitivo"></option>
              </datalist>
            </div>

            <div>
              <label
                ><input type="checkbox" name="acepta_terminos" required />
                Acepto terminos</label
              >
            </div>
          </div>
        </section>
